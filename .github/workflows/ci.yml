name: CI (lint, typecheck, build, test)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR makes the in-flight run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Install plus all four checks is ~2 minutes; anything approaching this
    # is hung, and GitHub's default would let it burn 6 hours of runner time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      # Yarn 4.18.0 comes from the packageManager field via Corepack — this
      # repo vendors no Yarn binary under .yarn/. Corepack must be enabled
      # before any yarn invocation, which is also why setup-node's
      # `cache: yarn` isn't used: its cache probe shells out to `yarn config`
      # before this step has run.
      - name: Enable Corepack
        run: corepack enable

      # The fixture-provenance step below shells out to python3. It currently
      # works only because the ubuntu-latest image happens to ship one, which
      # is a property of the runner image rather than of this workflow — and a
      # provenance check that silently stops running is worth less than no
      # check, because the green tick still reads as "verified".
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        id: install
        run: yarn install --immutable

      # Every check runs even after an earlier one fails, so a lint break
      # doesn't hide a test break; the job still fails if any of them fail.
      # Gating on the install's outcome keeps a failed install from producing
      # four cascading "command not found" failures instead of one clear one.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn typecheck

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn build

      # Separate from `yarn build` on purpose: a frontend-toolchain failure
      # must never block building (and therefore hot-fixing) the trading
      # process, but the bundle still has to prove it builds somewhere.
      - name: Build web dashboard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn build:web

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test

      # Backticked inline path citations in markdown (#821). This step is the
      # mechanism's production caller — the tool is otherwise a complete, tested
      # thing nothing runs, which is this repo's dominant defect class (#430). The
      # suite asserts the same green on the real tree, so a local `yarn test` catches
      # a stale citation too; this step is what makes it a merge gate.
      #
      # Never "fix" a red run here by editing a file under docs/adr/,
      # docs/wayfinder/, docs/research/archive/ or docs/reviews/ — those are not
      # scanned at all, and rewriting a decision record to satisfy a checker
      # falsifies the record. The tool's own failure output says so.
      - name: Path citations resolve
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn check:citations

      # The indicator golden fixture is the independent reference the whole
      # characterisation rests on (#703 step B1), and its authority comes from
      # being generated rather than hand-written. Without this step that is an
      # honour-system claim: a hand-edited `indicator-golden.json` would make
      # every golden case agree with whatever it was edited to say, and the
      # suite would go green confirming the bug.
      #
      # Deliberately unconditional on the other steps: it is a provenance check,
      # not a consequence of the tests. The generator is stdlib-only and
      # deterministic by construction (an LCG written out in the script, no
      # `random`, no network), so a diff here means exactly one of two things —
      # an intended fixture change that was not regenerated, or an edit to the
      # fixture that was never in the generator at all.
      - name: Indicator golden fixture is generated, not hand-edited
        if: ${{ !cancelled() }}
        run: |
          FIXTURE=server/providers/market-data-service/__fixtures__/indicator-golden.json
          python3 server/providers/market-data-service/__fixtures__/generate-indicator-golden.py
          # `git diff` alone would NOT catch the worst case. It only sees tracked
          # modifications, so if the fixture were ever dropped from a commit the
          # generator would recreate it UNTRACKED and a diff check would pass on
          # a repo that does not contain the file at all. `git status --porcelain`
          # reports untracked (`??`) and modified alike, so any non-empty output
          # is a failure.
          STATUS="$(git status --porcelain -- "$FIXTURE")"
          if [ -n "$STATUS" ]; then
            echo "::error::$FIXTURE is not what the generator produces:"
            echo "$STATUS"
            git diff -- "$FIXTURE" | head -50
            exit 1
          fi

  # The dashboard's browser suite (#544). Its own job because it needs a
  # browser download and several minutes of wall clock, and because a UI
  # regression must not be able to hide behind — or delay — the checks that
  # gate the trading process.
  #
  # Requires NO repository secret: the suite serves the real bundle from
  # `dist/server/apps/service-api/fixture-server.js` over an in-memory store, and
  # fails itself if the page makes a single off-origin request.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      # Same Corepack-before-yarn ordering as `checks` above.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Chromium only: the operator runs one browser on one MacBook, and a
      # matrix here would triple the job for coverage nobody consumes.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # These steps carry no `if:`, unlike `checks` above — there each check is
      # independent and worth running past a failure, here each step is the
      # previous one's prerequisite and running past a failure would only
      # produce a second, derived error.
      #
      # No separate build step either: the suite's `webServer` runs `yarn build`
      # itself, so the bytes under test are always the ones this job produced.
      - name: E2E
        run: yarn e2e

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
