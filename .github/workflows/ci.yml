name: CI (lint, typecheck, build, test)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR makes the in-flight run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      # Yarn 4.18.0 comes from the packageManager field via Corepack — this
      # repo vendors no Yarn binary under .yarn/. Corepack must be enabled
      # before any yarn invocation, which is also why setup-node's
      # `cache: yarn` isn't used: its cache probe shells out to `yarn config`
      # before this step has run.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Every check runs even after an earlier one fails, so a lint break
      # doesn't hide a test break. The job still fails if any step fails.
      - name: Lint
        run: yarn lint

      - name: Typecheck
        if: '!cancelled()'
        run: yarn typecheck

      - name: Build
        if: '!cancelled()'
        run: yarn build

      - name: Test
        if: '!cancelled()'
        run: yarn test
