name: CI (lint, typecheck, build, test)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR makes the in-flight run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Oxlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:oxlint

      - name: Biome
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:biome

      - name: Fallow architecture boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: fallow-rs/fallow@4f3bd9720ca6b22c8547adb7f1d225f57fc502d4 # v3
        with:
          command: dead-code
          args: --boundary-violations
          auto-changed-since: false

      # Grandfathers the pre-existing backlog (fallow-baselines/dead-code.json,
      # captured 2026-09-17) so this gates only NEW findings, not the ~57 that
      # predate the gate. Re-save the baseline after deliberately clearing part
      # of the backlog: `npm run fallow:dead-code -- --save-baseline fallow-baselines/dead-code.json`.
      - name: Fallow dead code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: fallow-rs/fallow@4f3bd9720ca6b22c8547adb7f1d225f57fc502d4 # v3
        with:
          command: dead-code
          baseline: fallow-baselines/dead-code.json
          auto-changed-since: false

      # Findings still surface as annotations, but neither step below can
      # actually fail on them today: dupes only fails past --threshold
      # (unset, so 0 = no limit) and health --css's hotspots/refactoring
      # targets are advisory-only by design (never gate an exit code). This
      # step still catches the action itself erroring.
      - name: Fallow duplication (advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: fallow-rs/fallow@4f3bd9720ca6b22c8547adb7f1d225f57fc502d4 # v3
        with:
          command: dupes
          auto-changed-since: false

      - name: Fallow design-system drift (advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: fallow-rs/fallow@4f3bd9720ca6b22c8547adb7f1d225f57fc502d4 # v3
        with:
          command: health
          args: --css
          auto-changed-since: false

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Build web dashboard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:web

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Path citations resolve
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:citations

      - name: Indicator golden fixture is generated, not hand-edited
        if: ${{ !cancelled() }}
        run: |
          FIXTURE=server/providers/market-data-service/__fixtures__/indicator-golden.json
          python3 server/providers/market-data-service/__fixtures__/generate-indicator-golden.py
          # `git diff` alone would NOT catch the worst case. It only sees tracked
          # modifications, so if the fixture were ever dropped from a commit the
          # generator would recreate it UNTRACKED and a diff check would pass on
          # a repo that does not contain the file at all. `git status --porcelain`
          # reports untracked (`??`) and modified alike, so any non-empty output
          # is a failure.
          STATUS="$(git status --porcelain -- "$FIXTURE")"
          if [ -n "$STATUS" ]; then
            echo "::error::$FIXTURE is not what the generator produces:"
            echo "$STATUS"
            git diff -- "$FIXTURE" | head -50
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
