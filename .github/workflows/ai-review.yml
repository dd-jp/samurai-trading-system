name: AI Code Review (Nous Portal — DeepSeek + Kimi)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - reviewer: nous-deepseek
            model_var: NOUS_MODEL
            app_id_var: NOUS_APP_ID
            app_key_secret: NOUS_APP_PRIVATE_KEY
          - reviewer: nous-kimi
            model_var: KIMI_MODEL
            app_id_var: KIMI_APP_ID
            app_key_secret: KIMI_APP_PRIVATE_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install openai

      - name: Run review (${{ matrix.reviewer }})
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          NOUS_BASE_URL: ${{ vars.NOUS_BASE_URL }}
          REVIEW_MODEL: ${{ vars[matrix.model_var] }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/run_review.py

      - name: Mint app token for ${{ matrix.reviewer }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars[matrix.app_id_var] }}
          private-key: ${{ secrets[matrix.app_key_secret] }}

      - name: Post review as ${{ matrix.reviewer }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: payload.event,
              body: payload.summary_markdown,
              comments: payload.comments,
            });
