name: AI Code Review (Nous Portal — DeepSeek + Kimi)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - reviewer: nous-deepseek
            model_var: NOUS_MODEL
            api_key_secret: NOUS_API_KEY
            app_id_var: NOUS_APP_ID
            app_key_secret: NOUS_APP_PRIVATE_KEY
          - reviewer: nous-kimi
            model_var: KIMI_MODEL
            api_key_secret: KIMI_NOUS_API_KEY
            app_id_var: KIMI_APP_ID
            app_key_secret: KIMI_APP_PRIVATE_KEY
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install openai

      - name: Run review (${{ matrix.reviewer }})
        env:
          NOUS_API_KEY: ${{ secrets[matrix.api_key_secret] }}
          NOUS_BASE_URL: ${{ vars.NOUS_BASE_URL }}
          REVIEW_MODEL: ${{ vars[matrix.model_var] }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/run_review.py

      - name: Mint app token for ${{ matrix.reviewer }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars[matrix.app_id_var] }}
          private-key: ${{ secrets[matrix.app_key_secret] }}

      - name: Post review as ${{ matrix.reviewer }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: payload.event,
              body: payload.summary_markdown,
              comments: payload.comments,
            });
