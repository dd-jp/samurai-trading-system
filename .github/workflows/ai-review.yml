name: AI Code Review (Nous Portal — DeepSeek + Kimi)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Re-review any PR on demand, including a CLOSED or MERGED one — #591 was
  # merged on a review that had read 37% of it and there was no way to ask for
  # another look without pushing a commit to a merged branch (#594).
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (works on merged/closed PRs)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# Keyed on the resolved PR number (not run id) so a manual dispatch racing a
# `synchronize` on the same PR — or two dispatches — share ONE group instead
# of both running to completion in parallel and both posting (#610): with
# slices taking 300-430s each, a simultaneous duplicate is real model spend
# and a duplicated review body.
#
# Deliberately at WORKFLOW level, not job level. The review job below has a
# 2-leg matrix (nous-deepseek, nous-kimi); a job-level group whose key omits
# matrix.* evaluates to the SAME string for both legs of one run, so it would
# put both legs of a single run in one group and serialize/cancel-cross them
# against each other — halving review coverage while reading like a guard.
# The duplication this exists to stop is the whole RUN, not one leg of it.
#
# `github.event.pull_request.number` and `github.event.inputs.pr_number` both
# stringify to the same PR number, so a `pull_request` run and a
# `workflow_dispatch` run for the same PR land in the same group.
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  # Cancel a stale run only when a FRESH `pull_request` event supersedes it:
  # a new push makes the in-progress review of an old commit obsolete, and
  # the fresh run reproduces whatever failure signal (#567's
  # "no usable review", or this run's own review) still applies. Never
  # cancel on `workflow_dispatch` — that trigger is an explicit, deliberate
  # request (often for a MERGED or CLOSED PR, per the comment on the trigger
  # below), and cancelling it would both waste spend already committed and
  # silently drop the request nobody would think to retry. A
  # `workflow_dispatch` run still queues behind whatever is in-flight in the
  # same group rather than running alongside it, which is what actually
  # prevents the concurrent double-spend/double-post #610 exists to stop —
  # queueing does that without cancelling anything.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    # The diff is now reviewed in slices, so one reviewer can make up to
    # MAX_SLICES (10) model calls. Absolute worst case is every slice
    # exhausting its retries: 3 x 170s timeout + 20s + 90s backoff ~= 10min per
    # slice, ~103min for ten. This is a BACKSTOP against a stuck endpoint
    # holding a runner for the 6h default, not a target — a healthy run of the
    # 3-slice #591 diff is a few minutes. Sized above the worst case on
    # purpose: a timeout kills the job with no review posted at all, which is
    # strictly worse than a slow one.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - reviewer: nous-deepseek
            model_var: NOUS_MODEL
            api_key_secret: NOUS_API_KEY
            app_id_var: NOUS_APP_ID
            app_key_secret: NOUS_APP_PRIVATE_KEY
            # 32768 (#1008 Mode A): deepseek is a reasoning model too, so the
            # same shape of failure the kimi comment below documents in detail
            # applies here — hidden chain-of-thought tokens count against
            # max_tokens and are spent before any answer text. On PR #996 this
            # leg burned the whole 8192 budget on a single ~26k-char slice and
            # returned finish_reason=length with content_chars=0 on all three
            # attempts. Raised to match kimi's 32768 rather than re-deriving a
            # separate number: same failure mode, same fix, same headroom
            # rationale (input is sliced to <=60k chars/call, so reasoning
            # burn per call is bounded the same way for both legs).
            max_tokens: "32768"
            inline_only: "false"
          - reviewer: nous-kimi
            model_var: KIMI_MODEL
            api_key_secret: KIMI_NOUS_API_KEY
            app_id_var: KIMI_APP_ID
            app_key_secret: KIMI_APP_PRIVATE_KEY
            # kimi-k3 is a reasoning model: hidden chain-of-thought tokens
            # count against max_tokens and are spent before any answer text.
            # At max_tokens=3000 it burned the whole budget on reasoning and
            # returned finish_reason=length with zero content, every time —
            # confirmed via the debug log in review_lib.py. 8192 makes that
            # rarer but does NOT fix it (#409 logged content_chars=0 and a
            # truncated 910-char body at this budget); review_lib.py now
            # retries an unusable response instead of posting the fragment.
            #
            # 32768 (#594): on #591 this model spent all 8192 on reasoning and
            # posted "no usable review in 3 attempts
            # (finish_reason=length, content_chars=0)" — three rolls of the
            # same loaded die, because the budget was structurally too small,
            # not flaky. Two changes make 32768 the right number rather than
            # just a bigger one: reasoning burn scales with INPUT size and the
            # diff is now sliced to <=60k chars per call, so each call reasons
            # over a fraction of what it used to; and 4x headroom leaves room
            # for the answer text after the chain-of-thought instead of
            # betting the whole budget on it. If Nous's endpoint refuses this
            # value it returns 4xx, and review_lib._is_fatal_request_error
            # re-raises rather than retrying — the job goes red with the
            # provider's own error instead of degrading to a skipped reviewer.
            max_tokens: "32768"
            inline_only: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve PR number
        id: pr
        env:
          # Via env, never interpolated straight into the script: a dispatch
          # input is attacker-controlled text as far as the shell is concerned.
          PR_INPUT: ${{ inputs.pr_number }}
          PR_EVENT: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="$PR_INPUT"
          else
            PR="$PR_EVENT"
          fi
          # Rejects empty, non-digits, and leading zeros. `0` and `00` passed
          # the digits-only test and then failed downstream as a confusing
          # `pulls/0` 404 rather than as a bad input.
          case "$PR" in
            ''|*[!0-9]*|0*)
              # NOT "$PR" verbatim: a `::error::` line is a workflow COMMAND,
              # so a newline in the value makes every following line parse as
              # another command. Strip to printable, drop the `::` delimiter,
              # and bound the length before it can reach the log.
              SAFE=$(printf '%s' "$PR" | tr -cd '[:alnum:]._/-' | cut -c1-32)
              echo "::error::pr_number must be a positive integer without leading zeros (got: '${SAFE}')"
              exit 1
              ;;
          esac
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Via env, like PR_INPUT above: a git ref name may contain shell
          # metacharacters, and interpolating one straight into the script
          # would run them.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # core.quotePath=false on the diff commands below: git C-quotes
          # paths with non-ASCII bytes by default, and a quoted `diff --git`
          # header is a different shape for the slicer to parse. review_lib
          # handles both, but emitting the plain form keeps the common path
          # simple. Inline `-c`, not `git config` — no repo state mutated.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # `github.base_ref` is empty on a manual dispatch, and for a MERGED
            # PR the base branch has moved past the fork point: diffing against
            # origin/main would find the merge base AT the PR head and print an
            # empty diff. Use the base SHA GitHub recorded on the PR itself.
            BASE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)
            git fetch origin "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
            # fetch-depth: 0 usually has it already; fetch only if it doesn't,
            # and let a genuine failure fail the step rather than `|| true`.
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch origin "$BASE_SHA"
            git -c core.quotePath=false diff "$BASE_SHA...refs/remotes/origin/pr-$PR_NUMBER" > diff.txt
          else
            # NOT `--depth=1`. `checkout` above already fetched full history
            # (`fetch-depth: 0`), and a shallow re-fetch of the base truncates
            # it again — after which `...` (which needs a MERGE BASE, not just
            # the two tips) fails with `fatal: origin/main...HEAD: no merge
            # base` and the whole review job exits 128 in under ten seconds.
            #
            # It only bites on a branch that has been REBASED: before that, the
            # shallow tip happens to be an ancestor of HEAD and the merge base
            # is found by luck. Every rebase-onto-main — which is the normal way
            # to clear a conflict — broke both reviewers until this line changed.
            git fetch origin "$BASE_REF"
            git -c core.quotePath=false diff "origin/$BASE_REF...HEAD" > diff.txt
          fi
          echo "diff bytes: $(wc -c < diff.txt)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ ! -s diff.txt ]; then
            # A diff-resolution bug on a merged PR would otherwise post
            # "_No diff detected — nothing to review._" and go green: the same
            # shape of lie as the silent truncation this ticket fixes.
            echo "::error::Resolved an empty diff for PR #$PR_NUMBER — refusing to post a review that would read as 'nothing to review'."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install openai

      # Fetched BEFORE the review runs, on purpose. Every `synchronize` push
      # re-reviews the whole branch diff (see "Get PR diff" above — the range
      # is merge-base...HEAD, not the pushed commits), and with no memory of
      # what it already said the reviewer re-posted the same findings on
      # unchanged code after every push. `run_review.py` matches these against
      # the marker it stamps on its own comments and drops repeats.
      #
      # Skipped on `workflow_dispatch`: that trigger is a deliberate request to
      # look again — often at a merged PR whose earlier review was the problem
      # (#594) — and deduping it against that very review would post an empty
      # one. No file written means dedup is off, which is what the script's
      # missing-file branch documents.
      #
      # `github.token` suffices: the workflow already holds
      # `pull-requests: write`, and reading needs less than that. Failing the
      # step on a fetch error rather than `|| true`-ing it: a silent fetch
      # failure would look exactly like "nothing was flagged before" and
      # quietly bring the duplicates back.
      - name: Fetch this reviewer's existing comments
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # `pipefail` because the pipeline below ends in `jq`: without it a
          # failing `gh` exits 0 through the pipe, writing an empty array that
          # reads as "nothing was flagged before" — the silent-disable this
          # step is supposed to fail loudly on.
          set -o pipefail
          # NOT `--paginate --slurp`. On a list endpoint that returns an array
          # per page, `--slurp` produces an array OF PAGES — `[[c1, c2]]`, not
          # `[c1, c2]`. `json.load` still yields a list, so a top-level type
          # check passes and every element then fails the per-comment dict
          # check downstream, turning dedup off while looking like it worked.
          # `--jq '.[]'` streams the comments as NDJSON and `jq -s` collects
          # them into one flat array. (`--slurp` cannot be combined with
          # `--jq` at all: gh rejects the pair outright.)
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" \
            --paginate --jq '.[]' | jq -s '.' > existing_comments.json
          # Counts COMMENTS. The earlier form counted pages, which would have
          # printed a reassuring "1" for an empty PR and masked the bug above.
          echo "existing review comments: $(jq 'length' existing_comments.json)"

      - name: Run review (${{ matrix.reviewer }})
        env:
          NOUS_API_KEY: ${{ secrets[matrix.api_key_secret] }}
          REVIEWER: ${{ matrix.reviewer }}
          EXISTING_COMMENTS_FILE: existing_comments.json
          NOUS_BASE_URL: ${{ vars.NOUS_BASE_URL }}
          REVIEW_MODEL: ${{ vars[matrix.model_var] }}
          REVIEW_MAX_TOKENS: ${{ matrix.max_tokens }}
          REVIEW_INLINE_ONLY: ${{ matrix.inline_only }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/run_review.py

      - name: Mint app token for ${{ matrix.reviewer }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars[matrix.app_id_var] }}
          private-key: ${{ secrets[matrix.app_key_secret] }}

      - name: Post review as ${{ matrix.reviewer }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # A merged PR can't be gated by an approval, and GitHub is stricter
          # about review events on a closed PR. Dispatch runs post as comments.
          FORCE_COMMENT_EVENT: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            const base = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              // NOT context.issue.number: it's undefined on workflow_dispatch.
              pull_number: Number(process.env.PR_NUMBER),
              event: process.env.FORCE_COMMENT_EVENT === 'true' ? 'COMMENT' : payload.event,
              body: payload.summary_markdown,
            };

            try {
              await github.rest.pulls.createReview({ ...base, comments: payload.comments });
            } catch (error) {
              // GitHub rejects the ENTIRE review if any one comment anchors to a
              // line it cannot resolve — "Unprocessable Entity: Line could not be
              // resolved". `commentable_lines` filters against our own
              // `git diff`, which can disagree with GitHub's view of the PR, and
              // when it does the whole reviewer job fails and the PR's checks go
              // red for a reason that has nothing to do with the code.
              //
              // Retry once with the findings folded into the body instead. A
              // review that reads slightly worse beats no review and a red check.
              // Matched on the MESSAGE, not just the status. 422 also covers an
              // invalid `event`, an oversized body and other validation faults,
              // and retrying those without inline comments would "succeed"
              // while masking a real bug behind a misleading warning.
              const unresolvable =
                error.status === 422 && /could not be resolved/i.test(error.message ?? '');
              if (!unresolvable) throw error;

              // GitHub caps a review body at 65536 characters. An untruncated
              // appendix can exceed that and raise the very 422 this fallback
              // exists to handle — failing the job anyway, one step later.
              const BODY_LIMIT = 65536;
              const header =
                `${payload.summary_markdown}\n\n---\n_GitHub would not anchor these inline ` +
                '(line not resolvable in its diff view):_\n';
              // The dedup marker is stamped on every inline body so a later
              // run can recognise its own findings. It is an HTML comment, so
              // it is invisible where it was meant to live — but folded into
              // the review body as prose it becomes a stray tag in a bullet
              // list, and it would anchor nothing there anyway.
              const strip = (body) => body.replace(/\n*<!-- ai-review:[^>]*-->\s*$/, '');
              const lines = payload.comments.map((c) => `- **${c.path}:${c.line}**: ${strip(c.body)}`);

              let body = header;
              let dropped = 0;
              for (const line of lines) {
                // 120 chars of headroom for the truncation note appended below.
                if (body.length + line.length + 120 > BODY_LIMIT) {
                  dropped++;
                  continue;
                }
                body += `${line}\n`;
              }
              if (dropped > 0) {
                body += `\n_(${dropped} further comment(s) omitted — review body size limit.)_`;
              }

              core.warning(
                `Inline anchoring rejected by GitHub; reposting ` +
                  `${payload.comments.length - dropped} of ${payload.comments.length} ` +
                  'comment(s) in the review body.',
              );
              await github.rest.pulls.createReview({ ...base, body });
            }

      # #567: a reviewer whose every attempted slice came back unusable
      # (finish_reason=length with zero content, in the observed case) used
      # to post that fact ONLY inside the review body — a place nobody reads
      # once the check shows green — while the job itself exited 0. This
      # step and the one below fix that: this one puts the fact where an
      # operator scanning the PR conversation will actually see it, using
      # `github.token` (not the minted app token from the step above) because
      # the workflow's own `pull-requests: write` permission is already
      # enough to comment and doesn't require granting the review app any
      # additional Issues scope just for this.
      - name: Flag it in the conversation if this reviewer produced nothing
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEWER: ${{ matrix.reviewer }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review_output.json')) return; // "Run review" step never produced output
            const payload = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            if (!payload.no_usable_review) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body:
                `**${process.env.REVIEWER} produced no review.** Every diff slice it ` +
                'attempted came back with no usable output (see that review\'s body for ' +
                'the retry detail). This PR has NOT received a review from this reviewer ' +
                '— re-run it via `workflow_dispatch` once the cause is addressed, or treat ' +
                'the remaining reviewer(s) as the only coverage this PR has.',
            });

      # Last on purpose: both the review and the conversation comment above
      # must post FIRST. Failing here after they've landed keeps both signals
      # intact; failing earlier (e.g. in "Run review") would kill the job
      # before either one existed, trading the one signal this check had for
      # a red X and nothing else (see PR body for why a red X alone doesn't
      # block a merge on this repo — there's no branch protection to enforce
      # it against).
      - name: Fail when this reviewer produced no usable review
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("review_output.json") as f:
              payload = json.load(f)

          if payload.get("no_usable_review"):
              print(
                  "::error::this reviewer produced no usable review — every diff slice "
                  "it attempted came back unusable. See the posted review body and PR "
                  "comment for detail. Not a pass."
              )
              sys.exit(1)
          PY
