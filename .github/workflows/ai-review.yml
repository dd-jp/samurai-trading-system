name: AI Code Review (Nous Portal — DeepSeek + Kimi)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - reviewer: nous-deepseek
            model_var: NOUS_MODEL
            api_key_secret: NOUS_API_KEY
            app_id_var: NOUS_APP_ID
            app_key_secret: NOUS_APP_PRIVATE_KEY
            max_tokens: "8192"
            inline_only: "false"
          - reviewer: nous-kimi
            model_var: KIMI_MODEL
            api_key_secret: KIMI_NOUS_API_KEY
            app_id_var: KIMI_APP_ID
            app_key_secret: KIMI_APP_PRIVATE_KEY
            # kimi-k3 is a reasoning model: hidden chain-of-thought tokens
            # count against max_tokens and are spent before any answer text.
            # At max_tokens=3000 it burned the whole budget on reasoning and
            # returned finish_reason=length with zero content, every time —
            # confirmed via the debug log in review_lib.py. 8192 makes that
            # rarer but does NOT fix it (#409 logged content_chars=0 and a
            # truncated 910-char body at this budget); review_lib.py now
            # retries an unusable response instead of posting the fragment.
            max_tokens: "8192"
            inline_only: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          # NOT `--depth=1`. `checkout` above already fetched full history
          # (`fetch-depth: 0`), and a shallow re-fetch of the base truncates it
          # again — after which `...` (which needs a MERGE BASE, not just the
          # two tips) fails with `fatal: origin/main...HEAD: no merge base` and
          # the whole review job exits 128 in under ten seconds.
          #
          # It only bites on a branch that has been REBASED: before that, the
          # shallow tip happens to be an ancestor of HEAD and the merge base is
          # found by luck. Every rebase-onto-main — which is the normal way to
          # clear a conflict — broke both reviewers until this line changed.
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install openai

      - name: Run review (${{ matrix.reviewer }})
        env:
          NOUS_API_KEY: ${{ secrets[matrix.api_key_secret] }}
          NOUS_BASE_URL: ${{ vars.NOUS_BASE_URL }}
          REVIEW_MODEL: ${{ vars[matrix.model_var] }}
          REVIEW_MAX_TOKENS: ${{ matrix.max_tokens }}
          REVIEW_INLINE_ONLY: ${{ matrix.inline_only }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/run_review.py

      - name: Mint app token for ${{ matrix.reviewer }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars[matrix.app_id_var] }}
          private-key: ${{ secrets[matrix.app_key_secret] }}

      - name: Post review as ${{ matrix.reviewer }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            const base = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: payload.event,
              body: payload.summary_markdown,
            };

            try {
              await github.rest.pulls.createReview({ ...base, comments: payload.comments });
            } catch (error) {
              // GitHub rejects the ENTIRE review if any one comment anchors to a
              // line it cannot resolve — "Unprocessable Entity: Line could not be
              // resolved". `commentable_lines` filters against our own
              // `git diff`, which can disagree with GitHub's view of the PR, and
              // when it does the whole reviewer job fails and the PR's checks go
              // red for a reason that has nothing to do with the code.
              //
              // Retry once with the findings folded into the body instead. A
              // review that reads slightly worse beats no review and a red check.
              // Matched on the MESSAGE, not just the status. 422 also covers an
              // invalid `event`, an oversized body and other validation faults,
              // and retrying those without inline comments would "succeed"
              // while masking a real bug behind a misleading warning.
              const unresolvable =
                error.status === 422 && /could not be resolved/i.test(error.message ?? '');
              if (!unresolvable) throw error;

              // GitHub caps a review body at 65536 characters. An untruncated
              // appendix can exceed that and raise the very 422 this fallback
              // exists to handle — failing the job anyway, one step later.
              const BODY_LIMIT = 65536;
              const header =
                `${payload.summary_markdown}\n\n---\n_GitHub would not anchor these inline ` +
                '(line not resolvable in its diff view):_\n';
              const lines = payload.comments.map((c) => `- **${c.path}:${c.line}**: ${c.body}`);

              let body = header;
              let dropped = 0;
              for (const line of lines) {
                // 120 chars of headroom for the truncation note appended below.
                if (body.length + line.length + 120 > BODY_LIMIT) {
                  dropped++;
                  continue;
                }
                body += `${line}\n`;
              }
              if (dropped > 0) {
                body += `\n_(${dropped} further comment(s) omitted — review body size limit.)_`;
              }

              core.warning(
                `Inline anchoring rejected by GitHub; reposting ` +
                  `${payload.comments.length - dropped} of ${payload.comments.length} ` +
                  'comment(s) in the review body.',
              );
              await github.rest.pulls.createReview({ ...base, body });
            }
