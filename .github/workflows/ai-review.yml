name: AI Code Review (Nous Portal — DeepSeek)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # On-demand re-review, including of a CLOSED or MERGED PR, which otherwise
  # cannot be re-reviewed without pushing to a merged branch (#594).
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (works on merged/closed PRs)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# Keyed on the PR number rather than the run id so a manual dispatch racing a
# `synchronize` on the same PR queues instead of running alongside it and
# double-spending/double-posting (#610).
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  # Never cancel a `workflow_dispatch` run: it is a deliberate request, often
  # for a merged PR nobody would think to retry. Queueing alone is what
  # prevents the concurrent double-post; cancelling is not needed for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    # Backstop against a stuck endpoint holding a runner for the 6h default,
    # not a target: worst case is 10 slices x ~10min of retries and backoff.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - reviewer: nous-deepseek
            model_var: NOUS_MODEL
            api_key_secret: NOUS_API_KEY
            app_id_var: NOUS_APP_ID
            app_key_secret: NOUS_APP_PRIVATE_KEY
            # Hidden chain-of-thought tokens count against max_tokens and are
            # spent before any answer text: at 8192 a single ~26k-char slice
            # returned finish_reason=length with content_chars=0 on all three
            # attempts (#996). Input is sliced to <=60k chars/call, so the
            # reasoning burn per call is bounded and 32768 leaves headroom for
            # the answer (#1008 Mode A).
            max_tokens: "32768"
            inline_only: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve PR number
        id: pr
        env:
          # Via env, never interpolated into the script: a dispatch input is
          # attacker-controlled text as far as the shell is concerned.
          PR_INPUT: ${{ inputs.pr_number }}
          PR_EVENT: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="$PR_INPUT"
          else
            PR="$PR_EVENT"
          fi
          # Leading zeros are rejected too: `0` passes a digits-only test and
          # then fails downstream as a confusing `pulls/0` 404.
          case "$PR" in
            ''|*[!0-9]*|0*)
              # An `::error::` line is a workflow COMMAND, so a newline in the
              # value would make every following line parse as another one.
              SAFE=$(printf '%s' "$PR" | tr -cd '[:alnum:]._/-' | cut -c1-32)
              echo "::error::pr_number must be a positive integer without leading zeros (got: '${SAFE}')"
              exit 1
              ;;
          esac
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Via env, like PR_INPUT above: a ref name may contain shell
          # metacharacters.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # core.quotePath=false: git C-quotes non-ASCII paths by default, and
          # a quoted `diff --git` header is a different shape for the slicer.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # `github.base_ref` is empty on a dispatch, and for a MERGED PR the
            # base branch has moved past the fork point — diffing against
            # origin/main would find the merge base AT the PR head and print an
            # empty diff. Use the base SHA GitHub recorded on the PR itself.
            BASE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)
            git fetch origin "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch origin "$BASE_SHA"
            git -c core.quotePath=false diff "$BASE_SHA...refs/remotes/origin/pr-$PR_NUMBER" > diff.txt
          else
            # NOT `--depth=1`: a shallow re-fetch re-truncates the history
            # `fetch-depth: 0` just fetched, after which `...` cannot find a
            # merge base on any REBASED branch and the job exits 128.
            git fetch origin "$BASE_REF"
            git -c core.quotePath=false diff "origin/$BASE_REF...HEAD" > diff.txt
          fi
          echo "diff bytes: $(wc -c < diff.txt)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ ! -s diff.txt ]; then
            # Otherwise a diff-resolution bug on a merged PR posts "no diff
            # detected" and goes green — a silent lie.
            echo "::error::Resolved an empty diff for PR #$PR_NUMBER — refusing to post a review that would read as 'nothing to review'."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install openai

      # Every `synchronize` re-reviews the whole merge-base...HEAD diff, so
      # without this the reviewer re-posts the same findings on unchanged code
      # after every push; `run_review.py` matches these against its own marker.
      # Skipped on `workflow_dispatch` because deduping a deliberate re-look
      # against the very review that prompted it would post an empty one (#594)
      # — no file written means dedup is off. A fetch error fails the step: a
      # silent one looks exactly like "nothing was flagged before".
      - name: Fetch this reviewer's existing comments
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Without pipefail a failing `gh` exits 0 through the pipe and writes
          # an empty array that reads as "nothing was flagged before".
          set -o pipefail
          # NOT `--paginate --slurp`: on a list endpoint that returns an array
          # per page, `--slurp` yields an array OF PAGES, which still loads as a
          # list and so passes the top-level type check while every element
          # fails the per-comment check — dedup off, looking like it worked.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" \
            --paginate --jq '.[]' | jq -s '.' > existing_comments.json
          echo "existing review comments: $(jq 'length' existing_comments.json)"

      - name: Run review (${{ matrix.reviewer }})
        env:
          NOUS_API_KEY: ${{ secrets[matrix.api_key_secret] }}
          REVIEWER: ${{ matrix.reviewer }}
          EXISTING_COMMENTS_FILE: existing_comments.json
          NOUS_BASE_URL: ${{ vars.NOUS_BASE_URL }}
          REVIEW_MODEL: ${{ vars[matrix.model_var] }}
          REVIEW_MAX_TOKENS: ${{ matrix.max_tokens }}
          REVIEW_INLINE_ONLY: ${{ matrix.inline_only }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/run_review.py

      - name: Mint app token for ${{ matrix.reviewer }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars[matrix.app_id_var] }}
          private-key: ${{ secrets[matrix.app_key_secret] }}

      - name: Post review as ${{ matrix.reviewer }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # A merged PR can't be gated by an approval, and GitHub is stricter
          # about review events on a closed PR.
          FORCE_COMMENT_EVENT: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            const base = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              // NOT context.issue.number: it's undefined on workflow_dispatch.
              pull_number: Number(process.env.PR_NUMBER),
              event: process.env.FORCE_COMMENT_EVENT === 'true' ? 'COMMENT' : payload.event,
              body: payload.summary_markdown,
            };

            try {
              await github.rest.pulls.createReview({ ...base, comments: payload.comments });
            } catch (error) {
              // GitHub rejects the ENTIRE review if one comment anchors to a
              // line it cannot resolve, and its view of the PR can disagree
              // with the `git diff` we filter against. Retry once with the
              // findings folded into the body. Matched on the message, not the
              // status alone: 422 also covers an invalid event or an oversized
              // body, and retrying those would mask a real bug.
              const unresolvable =
                error.status === 422 && /could not be resolved/i.test(error.message ?? '');
              if (!unresolvable) throw error;

              // GitHub caps a review body at 65536 characters; an untruncated
              // appendix would raise the very 422 this fallback handles.
              const BODY_LIMIT = 65536;
              const header =
                `${payload.summary_markdown}\n\n---\n_GitHub would not anchor these inline ` +
                '(line not resolvable in its diff view):_\n';
              // The dedup marker is an HTML comment, invisible only where it
              // was meant to live; in the body it becomes a stray tag.
              const strip = (body) => body.replace(/\n*<!-- ai-review:[^>]*-->\s*$/, '');
              const lines = payload.comments.map((c) => `- **${c.path}:${c.line}**: ${strip(c.body)}`);

              let body = header;
              let dropped = 0;
              for (const line of lines) {
                // 120 chars of headroom for the truncation note appended below.
                if (body.length + line.length + 120 > BODY_LIMIT) {
                  dropped++;
                  continue;
                }
                body += `${line}\n`;
              }
              if (dropped > 0) {
                body += `\n_(${dropped} further comment(s) omitted — review body size limit.)_`;
              }

              core.warning(
                `Inline anchoring rejected by GitHub; reposting ` +
                  `${payload.comments.length - dropped} of ${payload.comments.length} ` +
                  'comment(s) in the review body.',
              );
              await github.rest.pulls.createReview({ ...base, body });
            }

      # #567: a reviewer whose every slice came back unusable used to report
      # that only inside the review body — unread once the check shows green —
      # while the job exited 0. `github.token` suffices here and avoids
      # granting the review app an Issues scope just to comment.
      - name: Flag it in the conversation if this reviewer produced nothing
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEWER: ${{ matrix.reviewer }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review_output.json')) return; // "Run review" step never produced output
            const payload = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            if (!payload.no_usable_review) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body:
                `**${process.env.REVIEWER} produced no review.** Every diff slice it ` +
                'attempted came back with no usable output (see that review\'s body for ' +
                'the retry detail). This PR has NOT received a review from this reviewer ' +
                '— re-run it via `workflow_dispatch` once the cause is addressed.',
            });

      # Last on purpose: failing earlier would kill the job before the review
      # and the conversation comment above had posted, trading the one signal
      # this check had for a red X and nothing else.
      - name: Fail when this reviewer produced no usable review
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("review_output.json") as f:
              payload = json.load(f)

          if payload.get("no_usable_review"):
              print(
                  "::error::this reviewer produced no usable review — every diff slice "
                  "it attempted came back unusable. See the posted review body and PR "
                  "comment for detail. Not a pass."
              )
              sys.exit(1)
          PY
