<!DOCTYPE html>
<!--
  THROWAWAY PROTOTYPE — delete once #412 is decided. Not wired to the server,
  not typechecked, not tested, no build step. Open it in a browser directly.

  Question it answers (wayfinder #412): what is the visual primitive of the
  dashboard's pipeline tab — a stage rail, per-ticker lanes, or a trace
  waterfall? Three variants on one page, switchable via ?variant=A|B|C and the
  floating bottom bar (arrow keys work too).

  Constraints it deliberately respects, so the variants are judgeable as real:
    - zero runtime dependencies: hand-rolled inline SVG/CSS/JS only
    - the real dashboard's visual language (colours, density, badges) copied
      from src/dashboard/html.ts so this butts up against the actual app
    - live-ish, poll-only: a simulated 3s poll drives all motion, exactly the
      cadence GET /api/snapshot runs at today. Fast ticks flash rather than
      walk — that is the honest behaviour, not a prototype shortcut.

  Fixture data below is shaped like the real tables (audit_log rows, current_tick,
  debate_log.contributions_json). Values are invented; shapes are not.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Samurai — pipeline view prototype (#412)</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121622;
    --panel-2: #161b29;
    --border: #232a3d;
    --text: #e6e9f0;
    --muted: #8a93a8;
    --green: #2ecc71;
    --red: #ff5c6c;
    --amber: #f5a623;
    --blue: #4aa8ff;
    --violet: #a78bfa;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 90px;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.5px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .meta { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .pulse {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 0 rgba(46,204,113,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }

  /* ---- tab strip: the "how do the two views switch" question, made concrete ---- */
  .tabs { display: flex; gap: 2px; padding: 0 22px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .tab {
    padding: 9px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; user-select: none;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--blue); }
  .tab:hover:not(.active) { color: var(--text); }

  main { padding: 16px 22px; max-width: 1600px; margin: 0 auto; }
  .strapline { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .strapline b { color: var(--text); font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel h2 .count { color: var(--text); font-family: var(--mono); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-go { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-no_go { background: rgba(255,92,108,0.15); color: var(--red); }
  .badge-skip { background: rgba(138,147,168,0.18); color: var(--muted); }
  .badge-live { background: rgba(74,168,255,0.16); color: var(--blue); }
  .badge-bullish { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-bearish { background: rgba(255,92,108,0.15); color: var(--red); }
  .badge-neutral { background: rgba(138,147,168,0.18); color: var(--muted); }

  /* ---------- VARIANT A — stage rail ---------- */
  .rail { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; padding: 20px 14px 6px; position: relative; }
  .rail-node { position: relative; padding: 0 8px; }
  .rail-node .bar {
    height: 4px; background: var(--border); border-radius: 2px; position: relative;
  }
  .rail-node.hot .bar { background: linear-gradient(90deg, var(--blue), rgba(74,168,255,0.25)); }
  .rail-node .stage-name {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .rail-node.hot .stage-name { color: var(--blue); }
  .rail-node .stage-name .n { font-family: var(--mono); color: var(--text); font-size: 11px; }
  .rail-node .lock { font-size: 10px; color: var(--amber); letter-spacing: 0; text-transform: none; }
  .chips { min-height: 92px; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; font-family: var(--mono); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 7px; transition: transform .35s ease, opacity .35s ease;
  }
  .chip:hover { border-color: var(--blue); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
  .chip.live { border-color: var(--blue); }
  .chip.live .dot { background: var(--blue); animation: pulse 2s infinite; }
  .chip.done .dot { background: var(--green); }
  .chip.stopped .dot { background: var(--red); }
  .chip.skipped { opacity: .55; }
  .chip .el { margin-left: auto; color: var(--muted); font-size: 11px; }
  .rail-empty { color: var(--muted); font-size: 11px; padding-top: 14px; font-style: italic; }
  .gutter { border-top: 1px solid var(--border); padding: 12px 22px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .gutter .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-right: 6px; }

  /* ---------- VARIANT B — ticker lanes ---------- */
  .lanes { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lanes th {
    color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--border);
  }
  .lanes th:first-child { text-align: left; }
  .lanes td { padding: 0; border-bottom: 1px solid var(--border); }
  .lanes tr:last-child td { border-bottom: none; }
  .lane-name { padding: 10px 14px; font-family: var(--mono); white-space: nowrap; }
  .lane-name .cls { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-left: 7px; }
  .cell { padding: 10px 6px; text-align: center; cursor: pointer; }
  .seg {
    height: 22px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--muted);
    position: relative;
  }
  .seg.done { background: rgba(46,204,113,0.13); border-color: rgba(46,204,113,0.4); color: var(--green); }
  .seg.live { background: rgba(74,168,255,0.16); border-color: var(--blue); color: var(--blue); animation: pulse 2s infinite; }
  .seg.stopped { background: rgba(255,92,108,0.13); border-color: rgba(255,92,108,0.45); color: var(--red); }
  .seg.never { background: transparent; border-style: dashed; color: #3a4157; }
  .seg .retry {
    position: absolute; top: -5px; right: -5px; background: var(--amber); color: #1a1200;
    font-size: 9px; font-weight: 700; border-radius: 7px; padding: 0 4px; line-height: 13px;
  }
  .lane-detail { background: var(--panel-2); }
  .lane-detail .inner { padding: 12px 16px; font-size: 12px; }
  .dormant td { opacity: .45; }

  /* ---------- VARIANT C — trace waterfall ---------- */
  .wf { padding: 6px 14px 14px; }
  .wf-row { display: grid; grid-template-columns: 190px 1fr; gap: 12px; align-items: center; padding: 5px 0; }
  .wf-row.sub { padding: 2px 0; }
  .wf-label { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wf-row.head .wf-label { color: var(--text); }
  .wf-track { position: relative; height: 20px; background: linear-gradient(90deg, rgba(35,42,61,.55) 1px, transparent 1px) 0 0 / 10% 100%; border-radius: 3px; }
  .wf-row.sub .wf-track { height: 13px; }
  .wf-bar {
    position: absolute; top: 0; bottom: 0; border-radius: 3px; display: flex; align-items: center;
    padding: 0 7px; font-family: var(--mono); font-size: 10px; color: #0b0e14; font-weight: 600;
    white-space: nowrap; overflow: hidden; cursor: pointer;
  }
  .wf-bar.analysts { background: #4aa8ff; }
  .wf-bar.debate { background: #a78bfa; }
  .wf-bar.trader { background: #f5a623; }
  .wf-bar.risk { background: #ffb3ba; }
  .wf-bar.verdict { background: #2ecc71; }
  .wf-bar.execution { background: #7ee2b8; }
  .wf-bar.agent { background: rgba(167,139,250,0.45); color: var(--text); font-weight: 500; }
  .wf-bar.growing { background: repeating-linear-gradient(45deg, #4aa8ff, #4aa8ff 6px, #3f92e0 6px, #3f92e0 12px); }
  .wf-bar.retry { outline: 1px dashed var(--amber); outline-offset: -1px; }
  .wf-trace { border-top: 1px solid var(--border); padding: 10px 0 6px; }
  .wf-trace:first-child { border-top: none; }
  .wf-meta { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin: 0 0 4px 202px; }
  .wf-axis { display: grid; grid-template-columns: 190px 1fr; gap: 12px; font-size: 10px; color: var(--muted); font-family: var(--mono); }
  .wf-axis .ticks { display: flex; justify-content: space-between; }

  /* ---------- shared expansion drawer ---------- */
  .drawer { border-top: 1px solid var(--border); background: var(--panel-2); padding: 14px 18px; }
  .drawer h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .agents { display: flex; gap: 10px; flex-wrap: wrap; }
  .agent {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; min-width: 168px;
  }
  .agent .who { font-family: var(--mono); font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .agent .role { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 3px; }
  .agent .inf { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
  .agent .stance { display: flex; gap: 3px; margin-top: 6px; }
  .agent .stance i {
    width: 16px; height: 5px; border-radius: 2px; background: var(--border); font-style: normal;
  }
  .agent .stance i.bullish { background: var(--green); }
  .agent .stance i.bearish { background: var(--red); }
  .agent .stance i.neutral { background: var(--muted); }
  .reserved {
    border: 1px dashed var(--amber); border-radius: 6px; padding: 10px 12px; color: var(--amber);
    font-size: 12px; background: rgba(245,166,35,0.05);
  }
  .reserved b { color: var(--amber); }
  .reserved .why { color: var(--muted); display: block; margin-top: 4px; font-size: 11px; }

  /* ---------- prototype switcher (obviously not part of the design) ---------- */
  .switcher {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #f2f4f8; color: #10131c; border-radius: 999px; z-index: 100;
    display: flex; align-items: center; gap: 4px; padding: 6px 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.55); font-size: 13px;
  }
  .switcher button {
    border: none; background: #dfe3ec; color: #10131c; width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .switcher button:hover { background: #c9cfdd; }
  .switcher .who { padding: 0 10px; font-weight: 600; white-space: nowrap; }
  .switcher .who span { font-weight: 400; color: #4a5165; }
  .switcher .tag {
    background: #10131c; color: #f2f4f8; border-radius: 999px; padding: 3px 9px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  }
  footer { color: var(--muted); font-size: 11px; padding: 4px 22px 24px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="pulse"></div>
  <h1>Samurai</h1>
  <span class="sub">multi-agent trading system · operator dashboard</span>
  <span class="meta" id="meta">poll 3s · sim t+0s</span>
</header>

<div class="tabs">
  <div class="tab" title="The existing table view — unchanged, and still the default landing view">Overview</div>
  <div class="tab active">Pipeline</div>
</div>

<main>
  <p class="strapline" id="strapline"></p>
  <div id="view"></div>
</main>

<footer>Throwaway prototype for wayfinder #412 · fixture data, no server, no persistence · motion driven by a simulated 3s poll</footer>

<div class="switcher">
  <span class="tag">proto #412</span>
  <button type="button" id="prev" title="previous variant (←)">‹</button>
  <span class="who" id="who"></span>
  <button type="button" id="next" title="next variant (→)">›</button>
</div>

<script>
/* ------------------------------------------------------------------ *
 * FIXTURE DATA — shapes mirror the real tables, values are invented.
 *   trace: one tick = one trace_id (audit_log rows share it)
 *   stages: rows as tick-runner.ts writes them, incl. a retry and a
 *           short-circuit, because those are the cases #414 asks about
 * ------------------------------------------------------------------ */
const STAGES = ['analysts','debate','trader','risk','verdict','execution'];
const STAGE_LABEL = { analysts:'Analysts', debate:'Debate', trader:'Trader', risk:'Risk', verdict:'Verdict', execution:'Execution' };

const CONTRIBUTIONS = [
  { analyst_id:'technical',   analyst_type:'mandatory', final_position:'bullish', influence_score:0.41, stance:['neutral','bullish','bullish'] },
  { analyst_id:'sentiment',   analyst_type:'optional',  final_position:'bearish', influence_score:0.22, stance:['bearish','bearish','bearish'] },
  { analyst_id:'fundamental', analyst_type:'mandatory', final_position:'bullish', influence_score:0.37, stance:['bullish','neutral','bullish'] },
];
const PERSONAS = [
  { analyst_id:'bull',     analyst_type:'persona', final_position:'bullish', influence_score:0.44, stance:['bullish','bullish','bullish'] },
  { analyst_id:'bear',     analyst_type:'persona', final_position:'bearish', influence_score:0.31, stance:['bearish','bearish','neutral'] },
  { analyst_id:'mediator', analyst_type:'persona', final_position:'bullish', influence_score:0.25, stance:['neutral','neutral','bullish'] },
];

/* Each trace: durations in ms per stage, in the order they were reached.
   `decision` is the audit_log decision word. A trace that stops early simply
   has fewer stages — exactly how audit_log reads. */
const TRACES = [
  { trace_id:'t-9f3a21', instrument:'BTC-USD', asset_class:'crypto', started:-8,
    stages:[ {s:'analysts',ms:820,d:'quorum_met'}, {s:'debate',ms:9240,d:'converged_r3'},
             {s:'trader',ms:410,d:'intent_emitted'}, {s:'risk',ms:180,d:'sized_0.6R'},
             {s:'verdict',ms:95,d:'go'}, {s:'execution',ms:1480,d:'filled'} ], outcome:'go' },
  { trace_id:'t-77c0be', instrument:'SPY', asset_class:'equity', started:-52,
    stages:[ {s:'analysts',ms:640,d:'quorum_met'}, {s:'debate',ms:7110,d:'converged_r2'},
             {s:'trader',ms:390,d:'intent_emitted'}, {s:'risk',ms:210,d:'breaker_daily_loss'} ], outcome:'stopped', stopped_at:'risk' },
  { trace_id:'t-51ea08', instrument:'ETH-USD', asset_class:'crypto', started:-96,
    stages:[ {s:'analysts',ms:770,d:'quorum_met'}, {s:'debate',ms:11890,d:'converged_r3',retry:1},
             {s:'trader',ms:445,d:'intent_emitted'}, {s:'risk',ms:195,d:'sized_0.4R'},
             {s:'verdict',ms:88,d:'no_go'} ], outcome:'no_go' },
  { trace_id:'t-2b6d44', instrument:'TSLA', asset_class:'equity', started:-140,
    stages:[ {s:'analysts',ms:520,d:'quorum_skip'} ], outcome:'skipped', stopped_at:'analysts' },
  { trace_id:'t-c41f90', instrument:'QQQ', asset_class:'equity', started:-181,
    stages:[ {s:'analysts',ms:690,d:'quorum_met'}, {s:'debate',ms:6980,d:'converged_r2'},
             {s:'trader',ms:365,d:'no_setup'} ], outcome:'stopped', stopped_at:'trader' },
];

/* The in-flight tick — this is all `current_tick` gives us: one row, one stage. */
let LIVE = { instrument:'AAPL', asset_class:'equity', trace_id:'t-e07b13', stage:'analysts', elapsed:0 };

/* ------------------------------------------------------------------ *
 * SIMULATED 3s POLL — the whole point of "live-ish, poll-only".
 * The live tick advances on a real clock; the view only ever SEES it
 * every 3s, so fast stages get skipped over. That is the honest
 * behaviour, reproduced rather than designed around.
 * ------------------------------------------------------------------ */
const POLL_MS = 3000;
let simT = 0;
let liveStageIdx = 0;
let liveStartedAt = Date.now();

function advanceSim() {
  // Real stage durations vary wildly: Analysts ~0.7s, Debate ~9s, Trader/Risk
  // sub-second, Verdict ~0.1s. At a 3s poll, Trader+Risk+Verdict usually pass
  // between two polls and are never observed live.
  const dur = { analysts:800, debate:9000, trader:400, risk:200, verdict:100, execution:1500 };
  const elapsed = Date.now() - liveStartedAt;
  if (elapsed > dur[STAGES[liveStageIdx]]) {
    liveStageIdx++;
    liveStartedAt = Date.now();
    if (liveStageIdx >= STAGES.length) {
      // Tick completed: it leaves current_tick (deleted) and joins history.
      TRACES.unshift({
        trace_id: LIVE.trace_id, instrument: LIVE.instrument, asset_class: LIVE.asset_class, started: 0,
        stages: STAGES.map(s => ({ s, ms: dur[s], d: s === 'verdict' ? 'go' : 'ok' })), outcome:'go', fresh:true,
      });
      if (TRACES.length > 7) TRACES.pop();
      const next = [
        { instrument:'BTC-USD', asset_class:'crypto' }, { instrument:'MSFT', asset_class:'equity' },
        { instrument:'ETH-USD', asset_class:'crypto' }, { instrument:'AAPL', asset_class:'equity' },
      ][Math.floor(Math.random()*4)];
      LIVE = { ...next, trace_id:`t-${Math.random().toString(16).slice(2,8)}`, stage:'analysts', elapsed:0 };
      liveStageIdx = 0;
    }
  }
  LIVE.stage = STAGES[Math.min(liveStageIdx, STAGES.length-1)];
  LIVE.elapsed = Date.now() - liveStartedAt;
}

/* ------------------------------------------------------------------ *
 * Helpers
 * ------------------------------------------------------------------ */
function ms(n) { return n >= 1000 ? `${(n/1000).toFixed(1)}s` : `${n}ms`; }
function ago(mins) { return mins === 0 ? 'just now' : `${Math.abs(mins)}m ago`; }
function totalMs(trace) { return trace.stages.reduce((a,s)=>a+s.ms,0); }
function outcomeBadge(t) {
  if (t.outcome === 'go') return '<span class="badge badge-go">go</span>';
  if (t.outcome === 'no_go') return '<span class="badge badge-no_go">no go</span>';
  if (t.outcome === 'skipped') return '<span class="badge badge-skip">quorum skip</span>';
  return `<span class="badge badge-no_go">stopped · ${t.stopped_at}</span>`;
}

/* The Debate expansion — real per-analyst detail exists only for COMPLETED
   debates (debate_log.contributions_json). Live, there is nothing: round state
   is not persisted (decision #10). Both variants render that asymmetry. */
function agentCards(live) {
  if (live) {
    return '<div class="reserved"><b>Nothing to show while the debate is running.</b>' +
      '<span class="why">Round-by-round state is not persisted (Debate Engine decision #10). ' +
      'The stage is lit because current_tick says so; the analyst and persona detail below appears only once the debate closes.</span></div>';
  }
  const card = a =>
    '<div class="agent"><div class="who">'+a.analyst_id+
      '<span class="badge badge-'+a.final_position+'">'+a.final_position.slice(0,4)+'</span></div>' +
      '<div class="role">'+a.analyst_type+'</div>' +
      `<div class="stance">${a.stance.map(s=>`<i class="${s}"></i>`).join('')}</div>` +
      '<div class="inf">influence '+a.influence_score.toFixed(2)+'</div></div>';
  return '<h3>Analysts — views into the debate</h3><div class="agents">' + CONTRIBUTIONS.map(card).join('') + '</div>' +
         '<h3 style="margin-top:14px;">Personas — the argument itself</h3><div class="agents">' + PERSONAS.map(card).join('') + '</div>' +
         '<p class="muted" style="font-size:11px;margin:10px 0 0;">Stance strips read left→right by round. Source: <code>debate_log.contributions_json</code>.</p>';
}

/* Trader/Risk: the Tier-2 reserved slot. Nothing is persisted for these two
   stages today, so the prototype shows the empty slot honestly rather than
   inventing a drill-down. */
function reservedSlot(stage) {
  return '<div class="reserved"><b>' + STAGE_LABEL[stage] + ' records nothing yet — reserved slot.</b>' +
    '<span class="why">No trader_log / risk_log table exists; audit_log holds only a digest. ' +
    'What lands here is decided by the decision-record map (#328); where it lands is #417.</span></div>';
}

/* ================================================================== *
 * VARIANT A — STAGE RAIL
 * The system as a machine. Six fixed stations; tickers are chips that
 * sit on the station they last reached. Answers "where is the load?".
 * ================================================================== */
function VariantA() {
  const recent = TRACES.slice(0, 5);
  const nodes = STAGES.map(stage => {
    const hot = LIVE.stage === stage;
    const chips = [];
    if (hot) chips.push({ t: LIVE, cls:'live', el: ms(LIVE.elapsed) });
    recent.forEach(t => {
      const last = t.stages[t.stages.length-1];
      if (last.s !== stage) return;
      const cls = t.outcome === 'go' ? 'done' : t.outcome === 'skipped' ? 'skipped' : 'stopped';
      chips.push({ t, cls, el: ago(t.started) });
    });
    const locked = (stage === 'trader' || stage === 'risk')
      ? '<span class="lock">◇ no record</span>' : '';
    const body = chips.length
      ? chips.map(c =>
          '<div class="chip '+c.cls+'" data-stage="'+stage+'" data-live="'+(c.cls==='live')+'">' +
            '<span class="dot"></span>' + c.t.instrument + '<span class="el">'+c.el+'</span></div>').join('')
      : '<div class="rail-empty">—</div>';
    return '<div class="rail-node '+(hot?'hot':'')+'">' +
      '<div class="stage-name">'+STAGE_LABEL[stage]+' <span class="n">'+chips.length+'</span> '+locked+'</div>' +
      '<div class="bar"></div><div class="chips">'+body+'</div></div>';
  }).join('');

  const settled = TRACES.slice(0, 6).map(t =>
    '<div class="chip '+(t.outcome==='go'?'done':t.outcome==='skipped'?'skipped':'stopped')+'" data-trace="'+t.trace_id+'">' +
      '<span class="dot"></span>'+t.instrument+'<span class="el">'+ms(totalMs(t))+'</span></div>').join('');

  return '<div class="panel"><h2>Pipeline <span class="count">' +
      (LIVE.instrument + ' · ' + STAGE_LABEL[LIVE.stage].toLowerCase()) + '</span></h2>' +
      '<div class="rail">'+nodes+'</div>' +
      '<div class="gutter"><span class="lbl">settled</span>'+settled+'</div>' +
      '<div class="drawer" id="drawerA"><h3>Debate — click any chip or stage to change this panel</h3>' + agentCards(false) + '</div>' +
    '</div>';
}

/* ================================================================== *
 * VARIANT B — TICKER LANES
 * The fleet. One row per instrument, six columns. Answers "what is
 * each ticker doing, and which one is stuck?".
 * ================================================================== */
function VariantB() {
  const byInstrument = {};
  TRACES.forEach(t => { if (!byInstrument[t.instrument]) byInstrument[t.instrument] = t; });
  const universe = [
    { instrument:'BTC-USD', asset_class:'crypto' }, { instrument:'ETH-USD', asset_class:'crypto' },
    { instrument:'SPY', asset_class:'equity' }, { instrument:'QQQ', asset_class:'equity' },
    { instrument:'AAPL', asset_class:'equity' }, { instrument:'TSLA', asset_class:'equity' },
    { instrument:'MSFT', asset_class:'equity' },
  ];

  const rows = universe.map(u => {
    const t = byInstrument[u.instrument];
    const isLive = LIVE.instrument === u.instrument;
    const dormant = !t && !isLive;
    const cells = STAGES.map(stage => {
      if (isLive && LIVE.stage === stage) {
        return `<td class="cell"><div class="seg live">${ms(LIVE.elapsed)}</div></td>`;
      }
      if (isLive && STAGES.indexOf(stage) < STAGES.indexOf(LIVE.stage)) {
        return '<td class="cell"><div class="seg done">✓</div></td>';
      }
      if (!t) return '<td class="cell"><div class="seg never">·</div></td>';
      const hit = t.stages.find(s => s.s === stage);
      if (!hit) return '<td class="cell"><div class="seg never">·</div></td>';
      const last = t.stages[t.stages.length-1].s === stage;
      const cls = last && (t.outcome === 'stopped' || t.outcome === 'skipped' || t.outcome === 'no_go') ? 'stopped' : 'done';
      const retry = hit.retry ? `<span class="retry">×${hit.retry+1}</span>` : '';
      return `<td class="cell" data-inst="${u.instrument}" data-stage="${stage}"><div class="seg ${cls}">${ms(hit.ms)}${retry}</div></td>`;
    }).join('');
    const when = isLive ? '<span class="badge badge-live">live</span>'
              : t ? outcomeBadge(t)
              : '<span class="muted" style="font-size:11px;">market closed · no tick</span>';
    return '<tr class="'+(dormant?'dormant':'')+'">' +
      '<td class="lane-name">'+u.instrument+'<span class="cls">'+u.asset_class+'</span></td>' + cells +
      '<td class="cell" style="text-align:right;padding-right:14px;">'+when+'</td></tr>';
  }).join('');

  return '<div class="panel"><h2>Pipeline by ticker <span class="count">'+universe.length+' in universe</span></h2>' +
    '<table class="lanes"><thead><tr><th>Instrument</th>' +
      STAGES.map(s => `<th>${STAGE_LABEL[s]}</th>`).join('') + '<th style="text-align:right;">Outcome</th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table>' +
    '<div class="drawer"><h3>ETH-USD · t-51ea08 · debate (expanded row)</h3>' + agentCards(false) +
      '<div style="margin-top:14px;">'+reservedSlot('trader')+'</div></div>' +
  '</div>';
}

/* ================================================================== *
 * VARIANT C — TRACE WATERFALL
 * Time on the X axis, one bar per stage, agents nested under Debate.
 * Answers "where did the time and the money go?" — and makes the
 * 9-second debate impossible to miss.
 * ================================================================== */
function VariantC() {
  const shown = TRACES.slice(0, 4);
  const scaleMax = 16000; // ms across the full track width

  function bars(trace) {
    let cursor = 0;
    return trace.stages.map(st => {
      const left = (cursor / scaleMax) * 100;
      const width = Math.max((st.ms / scaleMax) * 100, 1.2);
      cursor += st.ms;
      const retry = st.retry ? ' retry' : '';
      return '<div class="wf-bar '+st.s+retry+'" style="left:'+left+'%;width:'+width+'%;" title="'+st.s+' · '+st.d+'">' +
        (width > 7 ? `${STAGE_LABEL[st.s]} ${ms(st.ms)}` : '') + '</div>';
    }).join('');
  }

  // The live trace: an open-ended bar that grows between polls.
  const liveElapsedTotal = STAGES.slice(0, liveStageIdx).reduce((a,s)=>a+({analysts:800,debate:9000,trader:400,risk:200,verdict:100,execution:1500})[s],0) + LIVE.elapsed;
  const liveWidth = Math.min((liveElapsedTotal / scaleMax) * 100, 100);
  const liveRow =
    '<div class="wf-trace">' +
      '<div class="wf-meta"><span class="badge badge-live">live</span><span class="mono">'+LIVE.trace_id+'</span>' +
        '<span>'+STAGE_LABEL[LIVE.stage].toLowerCase()+' · '+ms(LIVE.elapsed)+' in stage</span></div>' +
      '<div class="wf-row head"><div class="wf-label">'+LIVE.instrument+'</div>' +
        '<div class="wf-track"><div class="wf-bar growing" style="left:0;width:'+liveWidth+'%;">'+ms(liveElapsedTotal)+'</div></div></div>' +
      '<div class="wf-row sub"><div class="wf-label muted">agents</div><div class="wf-track">' +
        '<div class="wf-bar agent" style="left:0;width:'+liveWidth+'%;opacity:.35;">not persisted while running</div></div></div>' +
    '</div>';

  const traceRows = shown.map(t => {
    const debate = t.stages.find(s => s.s === 'debate');
    let sub = '';
    if (debate) {
      const start = t.stages.slice(0, t.stages.indexOf(debate)).reduce((a,s)=>a+s.ms,0);
      const per = debate.ms / 3;
      sub = [0,1,2].map(r =>
        '<div class="wf-row sub"><div class="wf-label muted">round '+(r+1)+' · bull/bear/med</div><div class="wf-track">' +
          '<div class="wf-bar agent" style="left:'+((start + r*per)/scaleMax*100)+'%;width:'+(per/scaleMax*100)+'%;">'+ms(Math.round(per))+'</div>' +
        '</div></div>').join('');
    }
    return '<div class="wf-trace">' +
      '<div class="wf-meta">'+outcomeBadge(t)+'<span class="mono">'+t.trace_id+'</span><span>'+ago(t.started)+' · '+ms(totalMs(t))+' total</span>' +
        (t.stages.some(s=>s.retry) ? '<span class="badge" style="background:rgba(245,166,35,.15);color:var(--amber);">1 retry</span>' : '') + '</div>' +
      '<div class="wf-row head"><div class="wf-label">'+t.instrument+'</div><div class="wf-track">'+bars(t)+'</div></div>' + sub +
    '</div>';
  }).join('');

  return '<div class="panel"><h2>Trace waterfall <span class="count">newest first · 16s scale</span></h2>' +
    '<div class="wf">' +
      '<div class="wf-axis"><div></div><div class="ticks"><span>0s</span><span>4s</span><span>8s</span><span>12s</span><span>16s</span></div></div>' +
      liveRow + traceRows +
    '</div>' +
    '<div class="drawer"><h3>BTC-USD · t-9f3a21 · debate bar clicked</h3>' + agentCards(false) +
      '<div style="margin-top:14px;">'+reservedSlot('risk')+'</div></div>' +
  '</div>';
}

/* ------------------------------------------------------------------ *
 * Switcher + render loop
 * ------------------------------------------------------------------ */
const VARIANTS = {
  A: { name:'Stage rail', render:VariantA,
       line:'<b>A — Stage rail.</b> The system as a machine: six fixed stations, tickers as chips sitting on the station they last reached. Reads load and bottlenecks at a glance; a single ticker\'s own journey is harder to follow.' },
  B: { name:'Ticker lanes', render:VariantB,
       line:'<b>B — Ticker lanes.</b> The fleet: one row per instrument, six columns. Per-ticker progress and dormancy (market closed) are obvious; it says nothing about how long anything took relative to anything else.' },
  C: { name:'Trace waterfall', render:VariantC,
       line:'<b>C — Trace waterfall.</b> Time on the X axis, stages as bars, debate rounds nested underneath. Makes the 9-second debate and its cost impossible to miss; least "at a glance", most diagnostic.' },
};
const KEYS = Object.keys(VARIANTS);

// Variant lives in a plain variable, with the URL as a nice-to-have mirror.
// Deliberately not URL-driven: when this page is viewed inside a sandboxed
// frame, history.replaceState throws and a URL-driven switcher silently stops
// working. The buttons must work everywhere.
let VARIANT = (() => {
  try {
    const v = new URLSearchParams(location.search).get('variant');
    return KEYS.includes(v) ? v : 'A';
  } catch { return 'A'; }
})();

function current() { return VARIANT; }
function go(k) {
  VARIANT = k;
  try {
    const url = new URL(location.href);
    url.searchParams.set('variant', k);
    history.replaceState(null, '', url);
  } catch { /* sandboxed frame — the variable above is the source of truth */ }
  render();
}
function cycle(step) {
  const i = KEYS.indexOf(current());
  go(KEYS[(i + step + KEYS.length) % KEYS.length]);
}

function render() {
  const k = current();
  const v = VARIANTS[k];
  document.getElementById('view').innerHTML = v.render();
  document.getElementById('strapline').innerHTML = v.line;
  document.getElementById('who').innerHTML = `${k} — <span>${v.name}</span>`;
  document.getElementById('meta').textContent = `poll 3s · sim t+${simT}s · live ${LIVE.instrument}`;
}

document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

// Advance the simulated tick on a fast timer, but only REPAINT every 3s —
// which is precisely why sub-second stages are never seen live.
setInterval(advanceSim, 120);
setInterval(() => { simT += 3; render(); }, POLL_MS);
render();
</script>
</body>
